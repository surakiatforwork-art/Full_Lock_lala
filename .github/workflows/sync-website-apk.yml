name: Update website APK
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: website-apk
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - name: Copy latest stable APK after verifying its checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/sync-website-apk.py
      - name: Commit public download files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- web/downloads
          if ! git diff --cached --quiet; then
            git commit -m "Update website APK from latest stable release"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
